target-version = "py311"
line-length = 180

[lint]
# W605 keeps regex literals as raw strings; carry it over should the lint configuration move to
# pyproject.toml (#101), otherwise invalid escape sequences can come back unnoticed
select = ["E4", "E7", "E9", "F", "I", "UP", "W605"]
ignore = [
    "UP006",
    "UP007",
    "UP008",
    "UP009",
    "UP031",
    "UP032",
    "UP034",
    "UP035",
    "UP036",
    "UP045",
]
